<section class="categories">

  <h2>Browse Categories</h2>

  <div class="category-grid">

    @for(category of categories; track category.name){

      <div class="category-card">

        <div class="icon">
          {{ category.icon }}
        </div>

        <h3>
          {{ category.name }}
        </h3>

      </div>

    }

  </div>

</section>
