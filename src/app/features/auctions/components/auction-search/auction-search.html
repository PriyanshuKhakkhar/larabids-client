<div class="search-ribbon-card card border-0 bg-white p-2 shadow-lg rounded-pill">
  <div class="row g-0 align-items-center px-2">
    
    <!-- Search String Box -->
    <div class="col-12 col-md-7 d-flex align-items-center pe-md-2 mb-2 mb-md-0 border-end-md border-light-subtle">
      <span class="text-secondary ps-3 pe-2">
        <i class="fas fa-search"></i>
      </span>
      <input type="text" 
             [(ngModel)]="searchQuery" 
             (input)="onParameterChange()" 
             class="form-control border-0 shadow-none bg-transparent py-2.5 text-sm font-medium" 
             placeholder="Search item title or category tag...">
    </div>

    <!-- Parameter Sort Dropdown -->
    <div class="col-12 col-md-5 d-flex align-items-center ps-md-2">
      <span class="text-secondary ps-2 pe-1 text-xs text-uppercase tracking-wider fw-bold">
        Sort
      </span>
      <select [(ngModel)]="sortBy" 
              (change)="onParameterChange()" 
              class="form-select border-0 shadow-none bg-transparent text-sm py-2.5 fw-semibold cursor-pointer">
        <option value="default">Default Priority</option>
        <option value="endingSoon">Ending Soonest</option>
        <option value="bidsDesc">Highest Demand (Bids)</option>
      </select>
    </div>

  </div>
</div>
