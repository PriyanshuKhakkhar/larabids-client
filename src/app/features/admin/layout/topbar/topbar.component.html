<header class="topbar">
  <div class="topbar-left">
    <button class="menu-toggle-btn" (click)="toggleSidebar()">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" placeholder="Search for auctions, users, or settings...">
    </div>
  </div>

  <div class="topbar-right">
    <button class="icon-btn position-relative">
      <i class="fa-regular fa-bell"></i>
      <span class="notification-badge">3</span>
    </button>
    
    <div class="user-profile">
      <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" alt="Admin Avatar" class="avatar">
      <div class="user-info d-none d-md-block">
        <span class="user-name">Super Admin</span>
        <span class="user-role">Administrator</span>
      </div>
      <i class="fa-solid fa-chevron-down text-muted ms-2"></i>
    </div>
  </div>
</header>
